[project]
name = "llm-meta-ai"
version = "0.2"
description = "LLM plugin for the Meta AI API"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Simon Willison"}]
license = "Apache-2.0"
classifiers = []
dependencies = [
    "llm>=0.31.1",
    "httpx",
]

[project.entry-points.llm]
meta_ai = "llm_meta_ai"

[dependency-groups]
dev = [
    "pytest",
    "pytest-httpx"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project.urls]
Homepage = "https://github.com/simonw/llm-meta-ai"
Changelog = "https://github.com/simonw/llm-meta-ai/releases"
Issues = "https://github.com/simonw/llm-meta-ai/issues"
CI = "https://github.com/simonw/llm-meta-ai/actions"
